<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0f14">
<title>Training Dashboard</title>
<style>
:root{--bg:#0b0f14;--bg2:#0f151c;--card:#141c25;--card2:#1a2430;--line:#243242;--tx:#e8eef5;--mu:#8fa0b2;--ac:#3ddc97;--ac2:#5b8cff;--am:#ffb454;--rd:#ff6b6b;--pu:#b388ff;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif}
body{padding-bottom:84px}
h1,h2,h3,h4{margin:0;line-height:1.2}
h2{font-size:18px;margin-bottom:10px}h3{font-size:15px;margin-bottom:8px}
a{color:var(--ac2)}
header.top{position:sticky;top:0;z-index:30;background:rgba(11,15,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px;letter-spacing:.2px;flex:1;min-width:160px}
.brand small{display:block;font-weight:500;color:var(--mu);font-size:11.5px;letter-spacing:0}
.brand b{color:var(--ac)}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:40;background:rgba(15,21,28,.97);border-top:1px solid var(--line);display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;min-width:64px;background:none;border:0;color:var(--mu);padding:6px 8px;border-radius:10px;font-weight:600;font-size:11px;line-height:1.1;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button span{font-size:19px;line-height:1}
nav.tabs button.on{color:var(--ac);background:rgba(61,220,151,.1)}
main{max-width:1180px;margin:0 auto;padding:14px}
.tab{display:none}.tab.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card.flat{background:transparent}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.auto{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0}
.stat .l{color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:.6px;font-weight:600}
.stat .v{font-size:26px;font-weight:800;margin-top:2px;letter-spacing:-.5px}
.stat .v small{font-size:13px;color:var(--mu);font-weight:600;margin-left:3px}
.stat .s{color:var(--mu);font-size:12px;margin-top:2px}
.pos{color:var(--ac)}.neg{color:var(--rd)}.warn{color:var(--am)}.mut{color:var(--mu)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.end{justify-content:flex-end}.row.sp{justify-content:space-between}
.btn{background:var(--card2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-weight:600;font-size:14px;font-family:inherit;cursor:pointer;min-height:40px}
.btn:hover{border-color:#34506b}
.btn.primary{background:var(--ac);color:#04140c;border-color:var(--ac)}
.btn.blue{background:var(--ac2);border-color:var(--ac2);color:#fff}
.btn.danger{color:var(--rd);border-color:#4a2a30}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 9px;min-height:30px;font-size:12.5px;border-radius:8px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mu);font-weight:600;min-width:0}
input,select,textarea{background:var(--bg2);color:var(--tx);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px;font-family:inherit;min-height:40px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(91,140,255,.55);border-color:var(--ac2)}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--ac);padding:0}
textarea{min-height:90px;resize:vertical}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.form .wide{grid-column:span 2}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mu);font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;background:var(--card)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:hover td{background:rgba(255,255,255,.02)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:var(--card2);color:var(--mu);border:1px solid var(--line)}
.pill.ok{color:var(--ac);background:rgba(61,220,151,.12);border-color:rgba(61,220,151,.3)}
.pill.warn{color:var(--am);background:rgba(255,180,84,.12);border-color:rgba(255,180,84,.3)}
.pill.bad{color:var(--rd);background:rgba(255,107,107,.12);border-color:rgba(255,107,107,.3)}
.pill.blue{color:var(--ac2);background:rgba(91,140,255,.12);border-color:rgba(91,140,255,.3)}
.chartbox{position:relative;height:280px}.chartbox.sm{height:170px}.chartbox.lg{height:330px}
.empty{text-align:center;padding:26px 14px;color:var(--mu)}
.empty b{display:block;color:var(--tx);font-size:16px;margin-bottom:4px}
.note{font-size:12.5px;color:var(--mu)}
.banner{border:1px solid rgba(255,180,84,.35);background:rgba(255,180,84,.08);color:#ffd9a3;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.banner.info{border-color:rgba(91,140,255,.35);background:rgba(91,140,255,.08);color:#c6d6ff}
.bar{height:8px;background:var(--bg2);border-radius:9px;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:9px}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;color:var(--mu);padding:6px 11px;border-radius:8px;font-weight:600;font-size:13px;font-family:inherit;cursor:pointer;min-height:32px}
.seg button.on{background:var(--card2);color:var(--tx)}
.day{border-left:4px solid var(--ac2)}
.day.done{border-left-color:var(--ac);opacity:.92}
.day ul{list-style:none;margin:8px 0 0;padding:0}
.day li{padding:5px 0;border-bottom:1px dashed #1f2c3a;font-size:14px;display:flex;gap:8px}
.day li .n{color:var(--mu);min-width:22px;font-variant-numeric:tabular-nums}
.day li.w{color:var(--mu)}.day li.o{color:var(--mu);font-style:italic}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
#modal,#session{position:fixed;inset:0;z-index:60;display:none}
#modal.open,#session.open{display:block}
#modal{background:rgba(0,0,0,.65);overflow:auto;padding:16px}
.mbox{background:var(--card);border:1px solid var(--line);border-radius:16px;max-width:520px;margin:5vh auto;padding:16px}
.mbox form{display:grid;gap:10px}
#session{background:var(--bg);overflow:auto;padding:0 0 40px}
#session .sh{position:sticky;top:0;background:rgba(11,15,20,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));z-index:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#session .sb{max-width:760px;margin:0 auto;padding:14px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.ex h4{font-size:16px}
.srow{display:grid;grid-template-columns:34px 1fr 1fr 48px;gap:8px;align-items:center;margin-top:8px}
.srow .sn{color:var(--mu);font-weight:700;text-align:center}
.srow .btn{padding:0;height:42px}
.srow.logged input{opacity:.6}
.sug{font-size:13px;margin-top:6px}
.sug b{color:var(--ac)}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%);background:#1d2b3a;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:80;font-weight:600;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;color:var(--am);min-width:56px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--bg2);border:1px solid var(--line);border-radius:99px;padding:5px 11px;font-size:12.5px;color:var(--mu)}
.hm{display:inline-block;min-width:34px;text-align:center;border-radius:6px;padding:2px 6px;font-weight:700;font-variant-numeric:tabular-nums}
@media(max-width:760px){
 .g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}
 .stat .v{font-size:23px}
 main{padding:10px}.card{padding:12px}
 .auto{grid-template-columns:1fr}
 .chartbox{height:240px}
 .form .wide{grid-column:span 2}
}
@media(min-width:900px){
 nav.tabs{position:sticky;top:57px;bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:center;padding:6px}
 nav.tabs button{flex-direction:row;font-size:13.5px;min-width:0;padding:8px 14px;gap:7px}
 nav.tabs button span{font-size:16px}
 body{padding-bottom:30px}#toast{top:70px}
}

/* ===== Log v2 ===== */
.lx-top{padding:12px}
.lx-days{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:12px}
.lx-day{min-height:46px;border-radius:12px;background:var(--bg2);border:1px solid var(--line);color:var(--mu);font-weight:700;font-size:14px;font-family:inherit;cursor:pointer;position:relative;padding:0}
.lx-day.on{background:var(--ac);border-color:var(--ac);color:#04140c}
.lx-day.today:not(.on)::after{content:"";position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--ac)}
.lx-title b{font-size:17px}
.lx-prog{margin-top:12px}
.lx-rest{font-size:15px;min-width:0}
.lx-bar{height:4px;background:#1b2733;overflow:hidden}
.lx-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));transition:width .25s}
.lx-bar.big{height:12px;border-radius:9px;margin-top:6px}
.lx-meta{display:flex;gap:10px;align-items:flex-end;margin-top:12px}
.lx-meta label.f{flex:1}
.lx-meta input{min-height:46px}
.lx-wk{display:flex;align-items:center;gap:8px}
.lx-wk b{min-width:20px;text-align:center;font-size:17px}
.lx-card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden;scroll-margin-top:70px}
.lx-card.open{border-color:#34506b}
.lx-card.ok{border-left:4px solid var(--ac)}
.lx-card.info{background:transparent;border-style:dashed}
.lx-h{width:100%;display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;color:var(--tx);font-family:inherit;padding:12px 12px;min-height:60px;cursor:pointer}
.lx-h.static{cursor:default;display:block;min-height:0;padding:10px 12px}
.lx-hl{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.lx-n{font-weight:700;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.lx-n i{font-style:normal;color:var(--mu);font-weight:600;margin-right:6px}
.lx-s{color:var(--mu);font-size:12.5px}
.lx-cnt{font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;white-space:nowrap}
.lx-cnt small{font-size:10.5px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.lx-cnt.ok{color:var(--ac)}
.lx-chev{color:var(--mu);font-size:20px;transition:transform .2s;width:18px;text-align:center}
.lx-card.open .lx-chev{transform:rotate(180deg)}
.lx-body{padding:4px 12px 14px}
.lx-info{font-size:13px;margin:6px 0;line-height:1.5}
.lx-last{display:inline-block;background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:2px 8px;margin:2px 4px 2px 0;font-variant-numeric:tabular-nums;font-weight:600}
.lx-done{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.lx-entry{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.lx-et{font-weight:800;font-size:16px;margin-bottom:6px}
.lx-et small{color:var(--mu);font-weight:600;font-size:13px}
.lx-st{margin-top:10px}
.lx-sl{font-size:12px;color:var(--mu);font-weight:600;margin-bottom:5px}
.lx-sr{display:grid;grid-template-columns:60px 1fr 60px;gap:8px}
.lx-pm{height:56px;border-radius:14px;background:var(--card2);border:1px solid var(--line);color:var(--tx);font-weight:700;font-size:28px;font-family:inherit;cursor:pointer;padding:0;touch-action:manipulation}
.lx-pm:active{background:var(--ac2);border-color:var(--ac2)}
.lx-pm.sm{height:44px;width:44px;font-size:22px;border-radius:12px}
.lx-sr input{height:56px;min-height:56px;text-align:center;font-weight:800;font-size:26px;font-family:inherit;border-radius:14px;padding:0 4px;-moz-appearance:textfield}
.lx-sr input::-webkit-outer-spin-button,.lx-sr input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.lx-rir{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.lx-rb{min-height:46px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--mu);font-weight:700;font-size:16px;font-family:inherit;cursor:pointer;padding:0}
.lx-rb.on{background:var(--am);border-color:var(--am);color:#241600}
.lx-log{width:100%;min-height:58px;margin-top:14px;border-radius:14px;background:var(--ac);border:0;color:#04140c;font-weight:800;font-size:18px;font-family:inherit;cursor:pointer;touch-action:manipulation}
.lx-log:active{filter:brightness(.85)}
.lx-row2{display:flex;gap:8px;margin-top:8px}
.lx-row2 .lx-sec{flex:1}
.lx-sec{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--tx);font-weight:600;font-size:14.5px;font-family:inherit;cursor:pointer;padding:0 12px;text-align:center;margin:0}
.lx-sec.wide{width:100%;margin-top:10px}
.lx-sec.on{color:var(--ac);border-color:rgba(61,220,151,.4);background:rgba(61,220,151,.08)}
.lx-add input{min-height:48px;font-size:16px}
.lx-add .lx-row2{margin-top:10px}
.lx-hist{padding:0}
.lx-hist>summary,.lx-grp>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;padding:8px 14px;cursor:pointer}
.lx-hist>summary::-webkit-details-marker,.lx-grp>summary::-webkit-details-marker{display:none}
.lx-hist>summary::after,.lx-grp>summary::after{content:"⌄";color:var(--mu);font-size:20px;transition:transform .2s}
.lx-hist[open]>summary::after,.lx-grp[open]>summary::after{transform:rotate(180deg)}
.lx-hist>summary>span:first-child{flex:1}
.lx-hist{padding-bottom:0}
.lx-hist[open]{padding-bottom:12px}
.lx-hist>*:not(summary){margin-left:12px;margin-right:12px}
.lx-filt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:2px;margin-bottom:10px}
.lx-filt select{min-height:46px}.lx-filt .full{grid-column:1/-1}
.lx-grp{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card2)}
.lx-grp>summary{min-height:50px;padding:6px 12px}
.lx-gt{flex:1;display:flex;flex-direction:column;line-height:1.25}
.lx-gt small{color:var(--mu);font-size:12px}
.lx-hx{padding:4px 12px 8px;border-top:1px solid var(--line)}
.lx-hn{font-weight:700;font-size:14px;padding:8px 0 2px;overflow-wrap:anywhere}
.lx-hr{display:flex;align-items:center;gap:8px;min-height:46px;border-bottom:1px dashed #1f2c3a}
.lx-hr:last-child{border-bottom:0}
.lx-hs{width:44px;color:var(--mu);font-size:13px}
.lx-hv{flex:1;font-weight:600;font-variant-numeric:tabular-nums}
.lx-hm{color:var(--am);font-size:12.5px;min-width:40px;text-align:right}
.lx-ib{width:44px;height:44px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--mu);font-size:16px;cursor:pointer;padding:0;flex:none}
.lx-ib.danger{color:var(--rd);border-color:#4a2a30}
.lx-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lx-sets{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.lx-set{display:flex;gap:6px;align-items:stretch}
.lx-sb{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:48px;background:rgba(61,220,151,.08);border:1px solid rgba(61,220,151,.28);border-radius:12px;color:var(--tx);font-weight:600;font-size:15px;font-family:inherit;padding:0 12px;cursor:pointer;text-align:left}
.lx-sb b{width:24px;height:24px;border-radius:50%;background:var(--ac);color:#04140c;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.lx-sb span{flex:1;font-variant-numeric:tabular-nums}
.lx-sb em{font-style:normal;color:var(--am);font-size:12.5px}
.lx-sb u{text-decoration:none;color:var(--mu)}
.lx-set .lx-ib{height:auto;min-height:48px}
.lx-plan{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border:1px dashed var(--line);border-radius:12px;color:var(--mu);font-size:14px;font-variant-numeric:tabular-nums}
.lx-pn{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.lx-entry{margin-top:0}
.lx-tg{color:var(--ac)!important}
.lx-lv{display:block;font-size:13px;font-weight:600;opacity:.8;margin-top:1px}
.lx-log.sm{min-height:50px;margin:0;font-size:16px}
.lx-row3{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:8px;margin-top:12px}
.lx-sec.danger{color:var(--rd);border-color:#4a2a30}
.lx-ed{background:var(--bg2);border:1px solid var(--ac2);border-radius:14px;padding:12px}
.lx-sum{display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:6px;margin-top:6px}
.lx-sum>span{display:flex;flex-direction:column;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums;min-width:0;line-height:1.25}
.lx-sum small{font-size:10px;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.lx-sum b{font-weight:800}
.lx-tag{font-style:normal;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--ac2);background:rgba(91,140,255,.12);border-radius:6px;padding:1px 6px;vertical-align:middle}
.lx-prev{margin-top:8px;border:1px solid var(--line);border-radius:12px;background:var(--bg2)}
.lx-prev>summary{list-style:none;cursor:pointer;min-height:46px;padding:6px 12px;display:flex;flex-direction:column;justify-content:center;font-size:13px;color:var(--mu);position:relative;padding-right:34px}
.lx-prev>summary::-webkit-details-marker{display:none}
.lx-prev>summary::after{content:"⌄";position:absolute;right:12px;top:10px;font-size:18px}
.lx-prev[open]>summary::after{transform:rotate(180deg)}
.lx-prev>.lx-set,.lx-prev>.lx-ed{margin:0 8px 8px}
.lx-pc{display:flex;flex-wrap:wrap}
.lx-cnt.mini{font-size:13px;flex-direction:row;gap:4px;align-items:baseline}
.lx-pvc{padding:12px}
.lx-pvr{display:block;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;color:var(--tx);font-family:inherit;cursor:pointer;min-height:64px}
.lx-pvr.info{cursor:default;opacity:.7;min-height:0}
.lx-pvh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.lx-pvn{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.lx-pvn i{font-style:normal;color:var(--mu);margin-right:6px}
#modal .btn,#modal input,#modal select{min-height:46px}
#main code{overflow-wrap:anywhere;word-break:break-word}
.lx-hist,.lx-grp{min-width:0;overflow-wrap:anywhere}
@media(min-width:760px){.lx-body{max-width:640px}}

/* ===== v3 polish: global ===== */
:root{--sp:12px}
body{font-size:15px}
h2{font-size:17px;font-weight:750;letter-spacing:-.1px}h3{font-size:15px;font-weight:700}
.card{border-radius:16px;padding:14px}
.btn{min-height:44px;border-radius:12px}
.btn.sm{min-height:44px;padding:6px 12px;font-size:13px;border-radius:10px}
input,select,textarea{min-height:44px;font-size:15px}
.seg button{min-height:44px;min-width:44px}
.btn.sm.ghost.danger{min-width:44px}
header.top{padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));flex-wrap:nowrap}
.brand{font-size:16px;min-width:0}
.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hmenu{position:relative}
.hmenu>summary{list-style:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;color:var(--tx)}
.hmenu>summary::-webkit-details-marker{display:none}
.hm-pop{position:absolute;right:0;top:50px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;min-width:230px;box-shadow:0 12px 30px rgba(0,0,0,.5);z-index:50;display:flex;flex-direction:column}
.hm-pop button,.hm-pop label{display:flex;align-items:center;min-height:46px;padding:0 12px;border-radius:10px;background:none;border:0;color:var(--tx);font-weight:600;font-size:14.5px;font-family:inherit;cursor:pointer;text-align:left}
.hm-pop button:hover,.hm-pop label:hover{background:var(--card2)}
#modal.sheet{padding:0;display:none;align-items:flex-end;justify-content:center}
#modal.sheet.open{display:flex}
#modal.sheet .mbox{margin:0;width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));border-bottom:0}
@media(min-width:760px){#modal.sheet{align-items:center}#modal.sheet .mbox{border-radius:20px;border-bottom:1px solid var(--line)}}
.sh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.sh-top h2{margin:2px 0;font-size:19px}
.sh-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.sw-cur{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(91,140,255,.1);border:1px solid rgba(91,140,255,.3);border-radius:12px;padding:8px 8px 8px 12px;font-size:13.5px;margin-bottom:12px}
.sw-cur .lx-sec{flex:none}
.sw-scope{display:grid;grid-template-columns:1fr 1fr;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.sw-scope button{min-height:44px;border:0;border-radius:9px;background:none;color:var(--mu);font-weight:700;font-size:13.5px;font-family:inherit;cursor:pointer}
.sw-scope button.on{background:var(--card2);color:var(--tx);box-shadow:inset 0 0 0 1px #34506b}
.sw-h{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--mu);font-weight:700;margin:16px 0 6px}
.sw-opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;min-height:52px;padding:8px 12px;margin-bottom:6px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--tx);font-family:inherit;cursor:pointer;text-align:left}
.sw-opt:active{border-color:var(--ac2)}
.sw-on{font-weight:700;font-size:15px}.sw-os{font-size:12.5px;color:var(--mu)}
.sw-f{display:grid;grid-template-columns:1fr auto;gap:8px}
.sw-f input{min-height:48px;font-size:16px}.sw-f .lx-log{padding:0 18px;width:auto}
/* log v3 */
.lx-wrap{max-width:760px;margin:0 auto}
.lx-title{display:flex;flex-direction:column;gap:2px}
.lx-title b{font-size:17px}
.lx-warn{margin-top:10px;font-size:13px;color:#ffd9a3;background:rgba(255,180,84,.08);border:1px solid rgba(255,180,84,.3);border-radius:10px;padding:8px 10px}
.lx-tools{display:grid;grid-template-columns:1fr 1fr 48px;gap:8px;margin-top:12px}
.lx-sec.icon{padding:0;font-size:18px}
.lx-sec.dashed{border-style:dashed;background:transparent;color:var(--mu);margin:4px 0 14px}
.lx-gh{font-size:11.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--mu);font-weight:700;margin:18px 4px 8px;display:flex;align-items:center;gap:8px}
.lx-gh::after{content:"";flex:1;height:1px;background:var(--line)}
.lx-h{align-items:flex-start;padding:12px 14px;min-height:64px}
.lx-hl{gap:3px}
.lx-n{font-size:16px;font-weight:750}
.lx-tl{font-size:13px;color:var(--mu);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.lx-ty{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--mu);border:1px solid var(--line);border-radius:6px;padding:0 5px;line-height:17px}
.lx-rl{font-size:13.5px;line-height:1.35}
.lx-rl b{font-weight:750;color:var(--tx)}.lx-rl b.up{color:var(--ac)}
.lx-swt{display:inline-block;align-self:flex-start;font-size:11.5px;font-weight:700;color:var(--ac2);background:rgba(91,140,255,.12);border-radius:6px;padding:1px 7px;margin-top:2px}
.lx-cnt{font-size:20px;flex-direction:row;align-items:baseline;gap:1px;padding-top:2px}
.lx-cnt small{font-size:13px;text-transform:none;letter-spacing:0}
.lx-chev{display:none}
.lx-acts{display:flex;gap:6px;overflow:hidden;margin:2px 0 10px}
.lx-acts.one{padding:0 12px 12px;margin:0}
.lx-ab{flex:1;min-width:0;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--mu);font-weight:600;font-size:11.5px;font-family:inherit;cursor:pointer;padding:2px}
.lx-ab span{font-size:16px;line-height:1.1;color:var(--tx)}
.lx-info{font-size:13px;color:var(--mu);margin:0 0 8px}
.lx-cue{color:var(--tx);opacity:.85;margin-top:4px}
.lx-cue::before{content:"Cue · ";color:var(--mu)}
.lx-bands{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.lx-bd{min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--mu);font-weight:700;font-size:12.5px;font-family:inherit;cursor:pointer;padding:0 2px}
.lx-bd i{width:16px;height:16px;border-radius:50%;display:block;box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.lx-bd.on{border-color:var(--tx);color:var(--tx);background:#22313f;box-shadow:inset 0 0 0 1px var(--tx)}
.lx-pvhd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lx-pvnote{margin:2px 0 4px}
.lx-pvx{color:var(--mu);font-size:13px;white-space:nowrap}
.lx-pvr{display:flex;flex-direction:column;gap:3px}
.lx-pvr .lx-gh{margin:0}
.lx-pvc .lx-gh{margin:14px 2px 6px}
.lx-card.note .lx-n{font-size:13px;font-weight:500;color:var(--mu)}.lx-card.note .lx-n b{color:var(--tx);font-weight:650}
.lx-card.info .lx-h.static{padding:10px 14px}
/* program v3 */
.pg-top .pg-wk{display:flex;align-items:center;gap:10px}
.pg-wkt{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center}
.pg-how{margin-top:10px;border-top:1px solid var(--line);padding-top:4px}
.pg-how>summary{min-height:44px;display:flex;align-items:center;cursor:pointer;color:var(--mu);font-size:13.5px;font-weight:600;list-style:none}
.pg-how>summary::-webkit-details-marker{display:none}
.pg-how>summary::after{content:"⌄";margin-left:auto;font-size:18px}
.pg-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(340px,1fr))}
@media(max-width:760px){.pg-grid{grid-template-columns:1fr}}
.pg-day{margin:0;border-left:4px solid var(--line)}
.pg-day.today{border-left-color:var(--ac2)}
.pg-day.done{border-left-color:var(--ac)}
.pg-dh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pg-dt{min-width:0}
.pg-dl{font-size:11.5px;font-weight:700;letter-spacing:.8px;color:var(--mu);text-transform:uppercase}
.pg-dh h3{font-size:16.5px;margin:3px 0 2px}
.pg-done{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 10px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mu);flex:none}
.pg-gh{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--mu);font-weight:700;margin:16px 0 2px}
.pg-row{display:flex;align-items:center;gap:8px;min-height:48px;border-bottom:1px solid #1c2734}
.pg-row.dim .pg-name{color:var(--mu)}
.pg-n{width:20px;flex:none;color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums;text-align:right}
.pg-m{flex:1;min-width:0;padding:6px 0}
.pg-name{font-size:14.5px;font-weight:600;line-height:1.3;overflow-wrap:anywhere}
.pg-sub{font-size:12px;color:var(--mu);line-height:1.35;margin-top:1px}
.pg-rx{font-size:13px;color:var(--tx);opacity:.85;white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right;max-width:96px;white-space:normal}
.pg-sw{width:44px;height:44px;flex:none;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ac2);font-size:17px;cursor:pointer;padding:0}
.pg-note{font-size:12.5px;color:var(--mu);padding:8px 0 4px}
.pg-note b{color:var(--tx);font-weight:600}
/* supersets */
.lx-n i.ss,.lx-pvn i.ss{background:rgba(91,140,255,.15);border-radius:5px;padding:0 5px;color:var(--ac2);font-weight:800;font-size:12.5px}
.pg-n{width:24px}
.pg-n.ss{background:rgba(91,140,255,.15);border-radius:6px;text-align:center;font-size:11.5px;font-weight:800;color:var(--ac2);padding:2px 0}
.lx-ss{font-size:12.5px;color:#a9c0ff;margin-bottom:6px}.lx-ss b{color:var(--tx);font-weight:650}
.pg-ssk{font-size:12px;color:var(--mu);margin-top:8px}
.pg-ssk i{font-style:normal;color:var(--ac2);font-weight:800;background:rgba(91,140,255,.15);border-radius:5px;padding:0 4px;margin-right:3px}
/* daily */
.dl-pr{margin-top:10px}
.dl-grid{display:grid;gap:6px 18px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin-top:8px}
.dl-gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);font-weight:700;margin:10px 2px 2px}
.dl-gh b{font-weight:700}
.dl-g.ok .dl-gh span{color:var(--ac)}
.dl-it{display:flex;align-items:flex-start;gap:12px;width:100%;min-height:48px;padding:10px 2px;background:none;border:0;border-bottom:1px solid #1c2734;color:var(--tx);font-family:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent}
.dl-g .dl-it:last-child{border-bottom:0}
.dl-home .dl-it{min-height:44px;padding:9px 2px;align-items:center}
.dl-cb{width:26px;height:26px;flex:none;border-radius:8px;border:2px solid #3a4d61;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#0b0f14;transition:background .12s}
.dl-it.on .dl-cb{background:var(--ac);border-color:var(--ac)}
.dl-it.on .dl-n{color:var(--mu)}
.dl-tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.dl-n{font-size:15px;font-weight:650;display:flex;flex-wrap:wrap;gap:2px 8px;align-items:baseline;overflow-wrap:anywhere}
.dl-d{font-size:13px;color:var(--mu);font-weight:500}
.dl-c{font-size:13px;color:var(--mu);line-height:1.4}
.dl-card{padding:2px 12px}
.dl-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.dl-stats div{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column}
.dl-stats b{font-size:20px}.dl-stats span{font-size:12px;color:var(--mu)}
.sw-scope.three{grid-template-columns:repeat(3,1fr)}
.sw-scope.three button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 2px;min-height:54px;font-size:16px}
.sw-scope.three small{font-size:11px;font-weight:600;color:var(--mu)}
.dl-rot{margin-bottom:10px}.dl-rn{margin-top:6px}
.dl-cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dl-ch{text-align:center;font-size:11px;color:var(--mu);font-weight:700}
.dl-day{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);color:var(--mu);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;padding:0}
.dl-day.full{background:rgba(61,220,151,.85);color:#0b0f14;border-color:transparent}
.dl-day.part{background:rgba(61,220,151,.2);color:var(--tx);border-color:rgba(61,220,151,.4)}
.dl-day.sel{box-shadow:0 0 0 2px var(--ac2)}
.dl-day.fut{border-style:dashed;opacity:.35;cursor:default}
.dl-leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--mu)}
.dl-leg i{display:inline-block;width:12px;height:12px;border-radius:4px;border:1px solid var(--line);background:var(--bg2);margin-right:5px;vertical-align:-1px}
.dl-leg i.full{background:rgba(61,220,151,.85)}.dl-leg i.part{background:rgba(61,220,151,.2)}
@media(min-width:760px){nav.tabs button{padding:8px 11px}}
/* how-to */
.ht{margin:0 0 10px}
.ht-t{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:44px;padding:0 12px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--tx);font-weight:600;font-size:14px;font-family:inherit;cursor:pointer}
.ht-t i,.pg-hw i{font-style:normal;display:inline-block;transition:transform .25s ease}
.hopen>.ht-t i,.hopen .pg-hw i{transform:rotate(180deg)}
.ht-p{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .28s ease,opacity .22s ease}
.hopen>.ht-p{grid-template-rows:1fr;opacity:1}
.ht-in{overflow:hidden;min-height:0}
.ht-c{padding:10px 4px 4px;font-size:13.5px;line-height:1.45;color:var(--tx)}
.ht-c p{margin:0 0 6px}.ht-c p>b{color:var(--mu);font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;margin-right:4px}
.ht-h{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);font-weight:700;margin:8px 0 2px}
.ht-c ul{margin:0;padding-left:18px}.ht-c li{margin:2px 0}.ht-c li::marker{color:var(--ac)}.ht-x li::marker{color:var(--rd)}
.ht-c .ht-b{background:rgba(91,140,255,.1);border:1px solid rgba(91,140,255,.3);border-radius:10px;padding:7px 9px;margin:10px 0 2px;font-size:13px}
.pg-item{border-bottom:1px solid #1c2734}
.pg-item .pg-row{border-bottom:0}
button.pg-m{background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;display:block;min-height:48px;padding:6px 0;-webkit-tap-highlight-color:transparent}
.pg-hw{display:inline-block;font-size:12px;color:var(--ac2);margin-top:3px;font-weight:600}
.pg-item>.ht-p .ht-c{padding:0 4px 12px 28px}
.dl-row{border-bottom:1px solid #1c2734}
.dl-g .dl-row:last-child{border-bottom:0}
.dl-rw{display:flex;align-items:flex-start;gap:6px}
.dl-rw .dl-it{border-bottom:0;flex:1;min-width:0}
.dl-hb{width:44px;height:44px;flex:none;margin-top:4px;border-radius:12px;border:1px solid var(--line);background:transparent;font-size:16px;cursor:pointer;color:var(--tx)}
.dl-row.hopen .dl-hb{border-color:var(--ac2);background:rgba(91,140,255,.12)}
.dl-row>.ht-p .ht-c{padding:0 4px 12px 40px}
.pg-n.cb,.lx-n i.cb{color:var(--am);background:rgba(255,180,84,.14)}
.pg-ssk i.cb{color:var(--am);background:rgba(255,180,84,.14)}
.lx-cht{padding:0 12px 2px}
@media (prefers-reduced-motion:reduce){.ht-p,.ht-t i,.pg-hw i{transition:none}}

/* phases · check-in · nutrition · session timer */
.ph h2{margin:2px 0 0}
.ph-g,.nu-g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.nu-g{grid-template-columns:repeat(2,minmax(0,1fr))}
.ph-g>div,.nu-g>div{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.ph-g .l,.nu-g .l{display:block;color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:650}
.ph-g b,.nu-g b{display:block;font-size:15px;margin-top:2px;line-height:1.25}
.nu-g b{font-size:20px}.nu-g b small{font-size:12px;color:var(--mu);font-weight:600}
.nu-g .s{display:block;font-size:11.5px;color:var(--mu);margin-top:1px}
.ph-f{margin-top:10px}
.ph-c{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 8px}
.ph-c .lx-sec{font-size:13.5px}
.tl{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.tl-r{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg2);display:flex;flex-direction:column;gap:1px}
.tl-r.on{border-color:rgba(91,140,255,.55);background:rgba(91,140,255,.08)}
.tl-r b{font-size:13.5px}.tl-r span{font-size:12px;color:var(--mu)}.tl-r em{font-style:normal;font-size:12px;color:#a9c0ff}
.ci-s{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;margin-top:4px}.ci-s small{color:var(--mu)}
.ci-fl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ci-dl{display:flex;flex-direction:column;gap:8px}
.ci-badge{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;margin:0 0 12px;padding:10px 14px;border-radius:14px;border:1px solid rgba(245,190,80,.45);background:rgba(245,190,80,.10);color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.ci-badge b{display:block;font-size:15px}.ci-badge small{display:block;color:var(--mu);font-size:12.5px;margin-top:1px}.ci-bi{font-size:22px}.ci-bg{margin-left:auto;font-weight:700;color:#f5be50;white-space:nowrap}
.ci-c.due{border-color:rgba(245,190,80,.45)}
.ci-due{background:rgba(245,190,80,.10);border:1px solid rgba(245,190,80,.35);border-radius:12px;padding:10px 12px;margin:2px 0 12px;font-size:13.5px;color:var(--mu)}
.ci-dueb{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ph-cd{display:flex;align-items:baseline;gap:10px;margin:10px 0 2px}.ph-cd b{font-size:44px;line-height:1;font-weight:800;color:var(--ac,#3ddc97)}.ph-cd span{color:var(--mu);font-size:14px}
.nu-pre{margin:4px 0 6px;color:#9ec5ff}
.ci-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ci-f{margin-top:12px}
.ci-seg{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.ci-seg label{flex:1 1 0;min-width:0;cursor:pointer}
.ci-seg input{position:absolute;opacity:0;width:0;height:0;pointer-events:none}
.ci-seg span{display:flex;align-items:center;justify-content:center;min-height:44px;min-width:28px;border-radius:9px;background:var(--card2);border:1px solid var(--line);font-weight:700;font-size:14px}
.ci-seg input:checked+span{background:rgba(61,220,151,.15);border-color:rgba(61,220,151,.5);color:var(--ac)}
.ci-seg input:focus-visible+span{outline:2px solid var(--ac2)}
.ci .lx-log{margin-top:14px}
.nu-t{margin-top:8px;display:flex;flex-direction:column;gap:2px;font-size:14px}
.nu-h{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--mu);font-weight:700;margin:12px 0 6px}
.nu-adv{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.nu-a{font-size:13px;border-radius:10px;padding:8px 10px;background:var(--bg2);border:1px solid var(--line);margin-top:6px}
.nu-adv .nu-a{margin-top:0}
.nu-a.ok{border-color:rgba(61,220,151,.35);color:#bff3dc}.nu-a.warn{border-color:rgba(255,180,84,.35);color:#ffd9a3}.nu-a.bad{border-color:rgba(255,107,107,.4);color:#ffc2c2}
.nu-x{display:flex;flex-direction:column;gap:4px}
.nu-x div{display:flex;gap:8px;align-items:baseline;font-size:13px}.nu-x span{width:14px;color:var(--mu)}.nu-x div.ok span,.nu-x div.ok{color:var(--ac)}
.nu-x em{margin-left:auto;font-style:normal;color:var(--mu);font-size:12px;text-align:right}
.nu-f{margin-top:12px}
.lx-ph{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lx-ses{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.lx-ses .note{flex:1}
.lx-ses.on{display:grid;grid-template-columns:auto 1fr auto;align-items:center}
.lx-sest{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}.lx-sest small{color:var(--mu);font-weight:600;font-size:12px}
.lx-ses .lx-bar{margin:0}
.lx-ses .lx-bar.warn i{background:var(--am)}.lx-ses .lx-bar.over i{background:var(--rd)}
.lx-ses .lx-sec.sm{min-height:44px;font-size:13px;padding:0 10px}
.lx-sesw{grid-column:1/-1;font-size:12.5px}.lx-sesw:empty{display:none}.lx-sesw.warn{color:var(--am)}.lx-sesw.over{color:var(--rd)}
.lx-rest{font-variant-numeric:tabular-nums;font-weight:700}.lx-rest.go{color:var(--ac)}.lx-rest.late{color:var(--am)}
.lx-rt{font-size:12.5px;color:var(--mu);margin-bottom:6px}
.lx-ss.ck{color:#d7c2ff}.lx-ss.dl{color:var(--am)}
.lx-rnd{margin:4px 0 8px!important;min-height:44px;font-size:13.5px}
.lx-n i.ss.ck,.lx-pvn i.ss.ck,.pg-ssk i.ck{color:var(--pu);background:rgba(179,136,255,.15)}
.pg-n.ss.ck{color:var(--pu);background:rgba(179,136,255,.15)}
.lx-warn.flare{color:#c6d6ff;background:rgba(91,140,255,.08);border-color:rgba(91,140,255,.35)}
.pg-tm{line-height:1.4}
.lx-tools{grid-template-columns:1fr 1fr 1fr 48px}
.lx-tools .lx-sec{font-size:13.5px;padding:0 6px}

/* rest bar */
.rb{position:fixed;left:8px;right:8px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:45;display:flex;align-items:center;gap:8px;padding:8px 8px 8px 14px;border-radius:16px;background:#1b2633;border:1px solid #2e3d50;box-shadow:0 8px 28px rgba(0,0,0,.5);transition:background .2s,border-color .2s}
.rb[hidden]{display:none}
.rb-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}
.rb-l{font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--mu)}
.rb-c{font-size:38px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.5px;color:var(--tx);margin:1px 0}
.rb-s{font-size:12px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-b{display:grid;grid-template-columns:repeat(2,52px);grid-template-rows:44px 44px;gap:6px;flex:none}
.rb-b button{min-width:44px;min-height:44px;border-radius:12px;border:1px solid #33465c;background:#243243;color:var(--tx);font-weight:600;font-size:14px;line-height:1;font-family:inherit;cursor:pointer;padding:0}
.rb-b .rb-p{font-size:18px}.rb-b .rb-x{color:#ffb4a8}
.rb.paused .rb-c{color:var(--mu)}
.rb.go{background:#0f3b2a;border-color:#2fbf7f}.rb.go .rb-l{color:#7af0b8;font-size:15px}.rb.go .rb-c{color:#3ddc97}
body.has-rest{padding-bottom:200px}
@media(min-width:760px){.rb{left:auto;right:20px;bottom:20px;width:400px}body.has-rest{padding-bottom:130px}}
/* rest settings */
.tg-r{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;padding:8px 0;background:none;border:0;border-bottom:1px solid #1c2734;color:var(--tx);font:inherit;text-align:left;cursor:pointer}
.tg-r b{display:block;font-size:15px}.tg-r small{display:block;color:var(--mu);font-size:12.5px;margin-top:2px}
.tg{flex:none;width:46px;height:28px;border-radius:14px;background:#2a3646;position:relative;transition:background .2s}.tg::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#cfd8e3;transition:transform .2s}
.tg.on{background:#2fbf7f}.tg.on::after{transform:translateX(18px);background:#fff}
/* watch form */
.ht-r{display:flex;gap:8px}.ht-r .ht-t{flex:1;min-width:0}
.ht-v,.sw-cv{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,80,80,.4);background:rgba(255,60,60,.10);color:#ff8a8a;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap;flex:none}
.sw-cv{margin-top:8px}
.pg-vd,.dl-vb,.sw-vd{width:44px;height:44px;flex:none;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;border:1px solid rgba(255,80,80,.4);background:rgba(255,60,60,.08);color:#ff8a8a;font-size:15px;text-decoration:none}
.dl-vb{margin-top:4px}
.sw-or{display:flex;gap:8px;align-items:stretch}.sw-or .sw-opt{flex:1;min-width:0}.sw-vd{height:auto;min-height:44px;margin-bottom:8px}
.ci-hist{margin-top:10px}.ci-ht{display:flex;flex-direction:column;gap:10px;margin:8px 0}.ci-hr{border:1px solid var(--line);border-radius:12px;padding:10px 12px}.ci-hr .ci-s{font-size:13px}
</style>

const PLAN_START='2026-10-12',PH_LEN=8;const phLen=i=>i===0?7:PH_LEN;/* Phase 1: 6 build weeks + Thanksgiving-week deload; later phases 7 + 1 */
const PH_T={build:{name:'Build',prog:'build',focus:'Hypertrophy · moderate reps, growth volume'},func:{name:'Functional strength',prog:'func',focus:'Main lifts 4–6 reps · more single-leg, power, sled sprints and carries · chest/arms/traps kept at growth volume'},

const phKey=i=>i<=0?'build':i%2===1?'func':(i%4===2?'hyp':'hyp1');
const planOf=()=>{const p=(S&&S.plan)||{};return{start:p.start||PLAN_START,shifts:p.shifts||{},early:p.early||{}}};
let TLc=null,TLk='';
function timeline(){const P=planOf();const k=JSON.stringify(P);if(TLc&&TLk===k)return TLc;
 const st=mondayOf(dayNum(P.start));const weeks=[];let cum=0;
 for(let i=0;i<260;i++){const mon=st+i*7;cum+=+P.shifts[fromDN(mon)]||0;weeks.push({mon,pos:i-cum})}
 const ep=new Set(weeks.filter(w=>P.early[fromDN(w.mon)]).map(w=>w.pos));const mx=Math.max(...weeks.map(w=>w.pos));const info=[];let ph=0,ps=0;
 for(let pos=0;pos<=mx;pos++){const wk=pos-ps+1;const dl=wk>=phLen(ph)||ep.has(pos);info[pos]={ph,wk,dl,early:dl&&wk<phLen(ph)};if(dl){ph++;ps=pos+1}}
 weeks.forEach(w=>Object.assign(w,w.pos<0?{ph:0,wk:1,dl:false,pre:1}:info[w.pos]));
 const phases=[];weeks.forEach(w=>{if(w.pre)return;let p=phases[w.ph];if(!p)p=phases[w.ph]={i:w.ph,key:phKey(w.ph),start:w.mon,end:w.mon+6,dl:[]};p.end=w.mon+6;if(w.dl)p.dl.push(w.mon)});
 TLc={st,weeks,phases};TLk=k;return TLc}
function weekInfo(date){const T=timeline();const mon=mondayOf(dayNum(date||todayStr()));let i=Math.round((mon-T.st)/7);
 if(i<0)return{mon,pos:-1,ph:0,wk:1,dl:false,pre:1,abs:1,key:'build'};if(i>=T.weeks.length)i=T.weeks.length-1;const w=T.weeks[i];return Object.assign({},w,{abs:Math.max(1,w.pos+1),key:phKey(w.ph)})}

const startTxt=()=>'Program starts '+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(fromDN(firstMon())+'T12:00').getDay()]+' '+fmtS(fromDN(firstMon()));
const progFor=date=>PROGS[PH_T[weekInfo(date).key].prog];
const rirOf=w=>w.dl?[4,4]:w.wk<=3?[2,3]:[1,2];
